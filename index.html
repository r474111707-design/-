<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="镜场直播增长实战系统：选品、话术、实播、复盘。">
  <title>镜场｜直播增长实战系统</title>
  <style>
    :root { --ink:#050505; --paper:#f5f4ef; --line:rgba(255,255,255,.22); --dim:rgba(255,255,255,.58); --lime:#d9ff37; }
    * { box-sizing:border-box; }
    html { background:var(--ink); scroll-behavior:smooth; }
    body { margin:0; min-width:320px; background:var(--ink); color:var(--paper); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
    a { color:inherit; }
    .page { min-height:100svh; position:relative; isolation:isolate; overflow:hidden; display:flex; flex-direction:column; padding:24px clamp(18px,4vw,64px) 24px; }
    .atmosphere { position:absolute; inset:0; z-index:-2; background:radial-gradient(circle at 51% 61%,rgba(167,190,53,.20),transparent 22%),radial-gradient(ellipse at 86% 18%,rgba(218,255,55,.12),transparent 15%),radial-gradient(ellipse at 10% 92%,rgba(89,106,30,.14),transparent 22%),#050505; }
    .grain { position:absolute; inset:0; z-index:-1; opacity:.16; background-image:linear-gradient(125deg,transparent 0 48%,rgba(255,255,255,.11) 49%,transparent 50% 100%); background-size:5px 5px; pointer-events:none; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; animation:enter .75s both; }
    .brand { display:inline-flex; align-items:center; gap:10px; text-decoration:none; font-weight:800; font-size:18px; letter-spacing:.08em; }
    .brand-mark { width:27px; height:27px; display:grid; place-items:center; border:1px solid var(--lime); border-radius:50%; color:var(--lime); font-size:15px; line-height:1; }
    .nav { display:flex; align-items:center; gap:8px; }
    .nav a { color:rgba(255,255,255,.78); text-decoration:none; font-size:13px; padding:8px 11px; border:1px solid transparent; border-radius:999px; transition:.2s ease; }
    .nav a:hover,.nav a:focus-visible { border-color:var(--line); color:white; outline:0; }
    .button { border:1px solid var(--lime); background:var(--lime); color:#0a0a08; text-decoration:none; padding:11px 16px; border-radius:999px; font-size:13px; font-weight:800; white-space:nowrap; transition:transform .2s ease,background .2s ease; }
    .button:hover,.button:focus-visible { transform:translateY(-2px); background:#edff91; outline:0; }
    .hero { flex:1; display:grid; align-content:end; padding-top:72px; }
    .hero-copy { max-width:1040px; animation:enter .85s .12s both; }
    .eyebrow { display:flex; align-items:center; gap:8px; color:var(--lime); font-size:12px; font-weight:700; letter-spacing:.16em; margin:0 0 19px; }
    .eyebrow::before { content:""; width:26px; height:1px; background:currentColor; }
    h1 { max-width:1000px; margin:0; font-family:"Songti SC","STSong",serif; font-weight:600; font-size:clamp(45px,7.4vw,112px); letter-spacing:-.075em; line-height:.98; }
    h1 em { font-style:normal; color:var(--lime); }
    .lead { max-width:540px; color:var(--dim); font-size:clamp(14px,1.22vw,17px); line-height:1.9; margin:24px 0 0; }
    .actions { display:flex; align-items:center; gap:12px; margin-top:29px; }
    .text-link { text-decoration:none; color:#fff; font-size:14px; font-weight:700; padding:11px 2px; border-bottom:1px solid rgba(255,255,255,.52); }
    .text-link:hover { color:var(--lime); border-color:var(--lime); }
    .bottom { margin-top:clamp(44px,7vh,94px); border-top:1px solid var(--line); display:grid; grid-template-columns:1.28fr repeat(3,1fr); animation:enter .9s .24s both; }
    .bottom > div { padding:18px 18px 2px 0; min-height:68px; }
    .bottom > div + div { border-left:1px solid var(--line); padding-left:18px; }
    .label { display:block; color:rgba(255,255,255,.44); font-size:11px; letter-spacing:.08em; margin-bottom:5px; }
    .value { font-size:13px; line-height:1.55; color:#fff; }
    .system { color:var(--lime); font-weight:700; }
    .scroll-hint { position:absolute; right:clamp(18px,4vw,64px); bottom:24px; writing-mode:vertical-rl; color:rgba(255,255,255,.42); font-size:10px; letter-spacing:.18em; }
    @keyframes enter { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    @media (max-width:720px) {
      .page { padding:18px 18px 20px; min-height:100svh; }
      .nav { display:none; }
      .hero { padding-top:70px; align-content:center; }
      h1 { font-size:clamp(46px,14.2vw,72px); line-height:1.04; }
      .lead { margin-top:21px; }
      .bottom { grid-template-columns:1fr 1fr; margin-top:52px; }
      .bottom > div:first-child { grid-column:1/-1; border-bottom:1px solid var(--line); padding-bottom:15px; }
      .bottom > div:nth-child(2) { border-left:0; padding-left:0; }
      .bottom > div:nth-child(4) { display:none; }
      .scroll-hint { display:none; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; scroll-behavior:auto !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="atmosphere" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="#首页" aria-label="镜场首页"><span class="brand-mark">镜</span><span>镜场</span></a>
      <nav class="nav" aria-label="主导航"><a href="#方法">方法体系</a><a href="#能力">核心能力</a><a href="#咨询">课程咨询</a></nav>
      <a class="button" href="mailto:hello@example.com">预约诊断</a>
    </header>
    <section class="hero" id="首页">
      <div class="hero-copy">
        <p class="eyebrow">直播增长实战系统</p>
        <h1>让<em>直播能力</em>成为<br>可复制的增长系统。</h1>
        <p class="lead">从选品、话术到实播、复盘，把每一次上播沉淀为可验证、可训练、可复用的成交能力。</p>
        <div class="actions" id="咨询"><a class="button" href="mailto:hello@example.com">预约一场诊断</a><a class="text-link" href="#能力">查看方法体系</a></div>
      </div>
      <div class="bottom" id="能力" aria-label="能力概览">
        <div id="方法"><span class="label">一套完整链路</span><span class="value system">选品 · 话术 · 实播 · 复盘</span></div>
        <div><span class="label">每一场直播</span><span class="value">可追溯地复盘</span></div>
        <div><span class="label">每一份经验</span><span class="value">可训练地传递</span></div>
        <div><span class="label">每一次迭代</span><span class="value">可持续地增长</span></div>
      </div>
    </section>
    <span class="scroll-hint" aria-hidden="true">向下探索</span>
  </main>
</body>
</html>
